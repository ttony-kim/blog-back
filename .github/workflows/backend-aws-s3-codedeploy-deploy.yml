name: Spring Boot CI/CD with Gradle

on:
  push:
    branches: [ "logging-feature-branch" ]
  pull_request:
    branches: [ "logging-feature-branch" ]

env:
  S3_BUCKET_NAME: s3-codedeploy-backend-artifacts
  CODE_DEPLOY_APP_NAME: code-deploy-backend
  CODE_DEPLOY_GROUP_NAME: dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        gradle-version: '8.2.1'

    - name: Build with Gradle Wrapper
      env:
        secretKey: ${{ secrets.BUILD_JASYPT_PASSWORD }}
      run: | 
        chmod +x ./gradlew
        ./gradlew build --stacktrace

    - name: Prepare deploy folder
      run: |
        mkdir -p deploy/build
        mv build/libs/*-SNAPSHOT.jar deploy/build/app.jar
        cp -r scripts docker-compose.yml appspec.yml deploy/

    - name: Create .env file
      env:
        SECRET_KEY: ${{ secrets.SYECRET_KE }}
        SPRING_PROFILE: ${{ secrets.SPRING_PROFILE }}
      run: |
        cat > deploy/.env <<EOF
        SECRET_KEY=${SECRET_KEY}
        SPRING_PROFILE=${SPRING_PROFILE}
        EOF

    - name: Create ZIP package
      run : |
        cd deploy
        ZIP_NAME="app-${GITHUB_SHA}.zip"
        zip -r ../$ZIP_NAME .

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: Upload to S3
      run: |
        ZIP_NAME="app-${GITHUB_SHA}.zip"
        aws s3 cp --region ap-northeast-2 $ZIP_NAME s3://$S3_BUCKET_NAME/$ZIP_NAME

    - name: Create CodeDeploy Deployment
      run: |
        aws deploy create-deployment \
          --application-name $CODE_DEPLOY_APP_NAME \
          --deployment-config-name CodeDeployDefault.OneAtATime \
          --deployment-group-name $CODE_DEPLOY_GROUP_NAME \
          --s3-location bucket=$S3_BUCKET_NAME,bundleType=zip,key=app-$GITHUB_SHA.zip
        
