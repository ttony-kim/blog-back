name: Spring Boot CI/CD with Gradle

on:
  push:
    branches: [ "aws-deploy" ]
  pull_request:
    branches: [ "aws-deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        gradle-version: '8.2.1'
    - name: Build with Gradle Wrapper
      env:
        secretKey: ${{ secrets.JASYPT_PASSWORD }}
      run: | 
        chmod +x ./gradlew
        ./gradlew build --stacktrace
    - name: Rename jar
      run: |
        mkdir -p build/libs
        mv build/libs/*-SNAPSHOT.jar build/libs/app.jar
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: build/libs/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs:  build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: app-jar
      - name: Stop docker container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_SERVER_HOST }}
          port: ${{ secrets.AWS_SERVER_PORT }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_KEY }}
          proxy_host: ${{ secrets.AWS_PROXY_SERVER_HOST }}
          proxy_port: ${{ secrets.AWS_PROXY_SERVER_PORT }}
          proxy_username: ${{ secrets.AWS_PROXY_SERVER_USER }}
          proxy_key: ${{ secrets.AWS_PROXY_SERVER_KEY }}
          script: |
            cd /home/ec2-user
            docker-compose down
      - name: Copy jar to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_SERVER_HOST }}
          port: ${{ secrets.AWS_SERVER_PORT }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_KEY }}
          proxy_host: ${{ secrets.AWS_PROXY_SERVER_HOST }}
          proxy_port: ${{ secrets.AWS_PROXY_SERVER_PORT }}
          proxy_username: ${{ secrets.AWS_PROXY_SERVER_USER }}
          proxy_key: ${{ secrets.AWS_PROXY_SERVER_KEY }}
          source: "app.jar"
          target: "/home/ec2-user/build"
      - name: Start docker container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_SERVER_HOST }}
          port: ${{ secrets.AWS_SERVER_PORT }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SERVER_KEY }}
          proxy_host: ${{ secrets.AWS_PROXY_SERVER_HOST }}
          proxy_port: ${{ secrets.AWS_PROXY_SERVER_PORT }}
          proxy_username: ${{ secrets.AWS_PROXY_SERVER_USER }}
          proxy_key: ${{ secrets.AWS_PROXY_SERVER_KEY }}
          script: |
            cd /home/ec2-user
            docker-compose up -d