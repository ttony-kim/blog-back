version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/backend/deploy

hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 300
      runas: ec2-user

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: ec2-user

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: ec2-user

permissions:
  - object: /home/ec2-user/backend/deploy
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755