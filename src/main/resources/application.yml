spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8084

file:
  upload:
    path: ${user.home}/upload

jasypt:
  encryptor:
    password: ${secretKey}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j