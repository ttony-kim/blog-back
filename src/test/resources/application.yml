spring:
  datasource:
    url: jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false


logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace

server:
  port: 8084

file:
  upload:
    path: ${user.home}/upload

jasypt:
  encryptor:
    password: ${secretKey}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

jwt:
  secret-key: ENC(aUBTr3LoTufYc9tIjIL17Dgr1GsSNVQOAu/aEPWEWV3Si6bgDMm7+ACE9gtoralNTnyrdwOIcws=)